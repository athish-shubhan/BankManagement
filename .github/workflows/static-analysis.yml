name: Static Analysis

on:
  push:
    branches: [ main ]

jobs:
  spotbugs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run SpotBugs via Maven
        run: mvn compile spotbugs:check